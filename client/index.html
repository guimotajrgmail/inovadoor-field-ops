<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1d2e" />
    <meta name="description" content="Inovadoor Field Ops — gestão de serviços, pessoas, terceiros e equipamentos." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Inovadoor Field Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isManagedPreview =
        /(^|\.)manus(?:pre)?\.computer$/.test(location.hostname) ||
        location.hostname === "localhost" ||
        location.hostname === "127.0.0.1";

      const clearManagedPreview = async () => {
        if (!isManagedPreview || !("serviceWorker" in navigator)) return;
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations.map(registration => registration.unregister())
        );
        const cacheKeys = await caches.keys();
        await Promise.all(cacheKeys.map(cacheKey => caches.delete(cacheKey)));
      };

      await clearManagedPreview();
      if (!isManagedPreview && "serviceWorker" in navigator) {
        await navigator.serviceWorker.register("/sw.js").catch(() => undefined);
      }
      await import("/src/main.tsx");
    </script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
